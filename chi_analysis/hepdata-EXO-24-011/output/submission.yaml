data_file: fig._6:_particle_level_chi_distribution_(3.0_<_m(jj)_<_3.6_tev).yaml
description: Normalized CHI = exp(|Y1-Y2|) distributions (1/SIG)*D(SIG)/DCHI in 3.0
  < M(JJ) < 3.6 TeV with |Y1+Y2|/2< 1.1 for 138 fb$^{-1}$ of integrated luminosity
  at $\sqrt{s} = 13$ TeV. The data distributions corrected for detector effects are
  compared to NNLO predictions with central scale choices $\mu_{F}$ = $\mu_{R}$ =
  $m_{jj}$ and $\mu_{F}$ = $\mu_{R}$ = $<p_{T}>$. Prediction with the alternative
  CT14 PDF set, and a comparison with the NLO prediction used in the previous publication
  are also given. Theoretical uncertainties with the central scale $\mu_{F}$ = $\mu_{R}$
  = $m_{jj}$ and using NNPDF3.1 are provided.
keywords:
- name: reactions
  values:
  - P P --> JET JET X
- name: cmenergies
  values:
  - 13000
- name: observables
  values:
  - DSIG/DCHI
location: Data from Figure 6 upper left
name: 'Fig. 6: Particle level CHI distribution (3.0 < M(JJ) < 3.6 TeV)'
